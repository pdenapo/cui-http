name: Publish binaries

# Un botón simple: Actions → "Publish binaries" → Run workflow → listo.
# También se dispara automáticamente al hacer push de un tag v*.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. v0.1.3)"
        required: false
        default: "v0.1.3"
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest, platform: x11 }
          - { os: ubuntu-latest, platform: glfw }
          - { os: ubuntu-latest, platform: sdl2 }
          # Windows (native win32 or glfw)
          - { os: windows-latest, platform: win32 }
          - { os: windows-latest, platform: glfw }
          # macOS (native cocoa)
          - { os: macos-latest, platform: cocoa }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libsqlite3-dev libcurl4-openssl-dev libglfw3-dev libsdl2-dev libx11-dev libgl-dev xvfb

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sqlite curl

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y
        shell: pwsh

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = if (Test-Path "C:\vcpkg\vcpkg.exe") { "C:\vcpkg" } elseif (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe") { "$env:VCPKG_INSTALLATION_ROOT" } else { $null }
          if (-not $vcpkg) { throw "vcpkg not found" }
          echo "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows

      - name: Configure
        shell: bash
        run: |
          set -e
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          VCPKG_ROOT="${VCPKG_ROOT//\\//}"
          CMAKE_ARGS=(-S "${WORKSPACE}" -B "${WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCUI_PLATFORM="${{ matrix.platform }}")
          if [ "${{ runner.os }}" = "Windows" ]; then
            CMAKE_ARGS+=(-DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
          fi
          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build "${GITHUB_WORKSPACE//\\//}/build" --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cui-http-${{ matrix.os }}-${{ matrix.platform }}
          path: |
            build/cui_http
            build/cui_http.exe
            build/cui_http_cli
            build/cui_http_cli.exe
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-platform tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in artifacts/cui-http-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            archive="cui-http-${name#cui-http-}.tar.gz"
            tar -czf "dist/${archive}" -C "$d" .
            echo "Created dist/${archive}"
          done
          ls -lh dist

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
