name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: glfw
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: glfw
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: cocoa
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: glfw
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            platform: win32

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libcurl4-openssl-dev libglfw3-dev libgl-dev libx11-dev libsdl2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sqlite curl glfw

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install curl sqlite3 --triplet x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCUI_PLATFORM=${{ matrix.platform }}
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
          -S ${{ github.workspace }}

      - name: Build
        shell: bash
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release --parallel 2

      - name: Test (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure