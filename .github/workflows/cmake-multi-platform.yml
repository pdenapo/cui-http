# Multi-platform CMake build for cui-http.
# Triggered on push/PR to main. Builds the C frontend + C backend for Linux
# and Windows (macOS can be added when a macOS runner is available).
name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: glfw
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: glfw
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            platform: win32

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42f93809386f8610446037f407233475273f361'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libcurl4-openssl-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y
        shell: pwsh

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCUI_PLATFORM=${{ matrix.platform }}
          ${{ runner.os == 'Windows' && format('-DCMAKE_TOOLCHAIN_FILE={0}/scripts/buildsystems/vcpkg.cmake', env.VCPKG_ROOT) || '' }}
          -S ${{ github.workspace }}

      - name: Build
        shell: bash
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure