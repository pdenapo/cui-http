name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: glfw
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: glfw
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: cocoa
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            platform: win32

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev libcurl4-openssl-dev libglfw3-dev libgl-dev libx11-dev libsdl2-dev xvfb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sqlite curl

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = if (Test-Path "C:\vcpkg\vcpkg.exe") { "C:\vcpkg" } elseif (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe") { "$env:VCPKG_INSTALLATION_ROOT" } else { $null }
          if (-not $vcpkg) { throw "vcpkg not found" }
          echo "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          echo "build-output-dir=${WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          set -e
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          VCPKG_ROOT="${VCPKG_ROOT//\\//}"
          CMAKE_ARGS=(-B "${WORKSPACE}/build" -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" -DCMAKE_BUILD_TYPE=Release -DCUI_PLATFORM="${{ matrix.platform }}" -S "${WORKSPACE}")
          if [ "${{ runner.os }}" = "Windows" ]; then
            CMAKE_ARGS+=(-DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
          fi
          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release --parallel 2

      - name: Test (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure